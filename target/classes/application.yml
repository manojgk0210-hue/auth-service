server:
  port: 8080

spring:
  application:
    name: auth-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/authdb}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:authuser}
    password: ${DB_PASSWORD:authpass}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

jwt:
  secret: ${JWT_SECRET:zrpCXCaD3bBF8ur0M8BmHlvJpH1Jyhu3+X/LtRuyTds=}
  expiration: ${JWT_EXPIRATION:3600000}
